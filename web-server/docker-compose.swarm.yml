version: "3.8"

services:
  access-door-web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --production && node server.js"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASSWORD
      - DEVICE_API_KEY=CHANGE_ME_DEVICE_API_KEY
      - DATA_DIR=/app/data
      - TZ=Asia/Jakarta
    volumes:
      - access_door_data:/app/data
      # Jika deploy langsung dari folder host di node Swarm utama:
      # - /opt/centralized-access-door:/app
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  access_door_data:
    driver: local
